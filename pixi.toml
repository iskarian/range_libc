[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "range_libc"
version = "0.1.0"

# The build script and pyproject.toml live in pywrapper/.
[package.build.source]
path = "pywrapper"

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }

# The extension is C++ and CUDA (includes/kernels.cu is compiled by nvcc).
[package.build.config]
compilers = ["c", "cxx", "cuda"]

[package.host-dependencies]
python = "*"
setuptools = "*"
cython = "*"
numpy = "*"
cuda-version = "13.*"
cuda-cudart-dev = "13.*"
cuda-driver-dev = "13.*"

[package.run-dependencies]
numpy = "*"
